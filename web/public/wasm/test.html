<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Go WASM SQLite POC Test</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; }
        pre { background: #f4f4f4; padding: 15px; overflow-x: auto; }
        button { margin: 5px; padding: 10px 20px; cursor: pointer; }
        .success { color: green; }
        .error { color: red; }
        #output { white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>Go WASM + sql.js Test</h1>
    <p>This page tests Go code compiled to WASM using sql.js for SQLite.</p>

    <div>
        <button onclick="simpleTest()">0. Simple Test</button>
        <button onclick="initDatabase()">1. Init Database</button>
        <button onclick="createTable()">2. Create Table</button>
        <button onclick="insertData()">3. Insert Test Data</button>
        <button onclick="queryData()">4. Query Data</button>
        <button onclick="testStats()">5. Test Stats</button>
        <button onclick="testRawQuery()">6. Raw Query</button>
        <br><br>
        <strong>OPFS Persistence:</strong>
        <button onclick="saveToOPFS()">💾 Save to OPFS</button>
        <button onclick="loadFromOPFS()">📂 Load from OPFS</button>
        <button onclick="clearOPFS()">🗑️ Clear OPFS</button>
        <button onclick="checkOPFS()">📊 Check OPFS</button>
    </div>

    <h2>Output:</h2>
    <pre id="output">Loading...</pre>

    <!-- sql.js must be loaded first -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>

    <!-- Go WASM support -->
    <script src="wasm_exec.js"></script>

    <script>
        const output = document.getElementById('output');

        function log(msg, isError = false) {
            const line = document.createElement('div');
            line.className = isError ? 'error' : 'success';
            line.textContent = typeof msg === 'object' ? JSON.stringify(msg, null, 2) : msg;
            output.appendChild(line);
            output.scrollTop = output.scrollHeight;
        }

        // Parse Go return values (they return JSON strings)
        function parseGoResult(result) {
            if (typeof result === 'string') {
                try {
                    return JSON.parse(result);
                } catch (e) {
                    return { ok: false, error: 'Failed to parse: ' + result };
                }
            }
            return result;
        }

        function clearOutput() {
            output.innerHTML = '';
        }

        // Initialize sql.js first
        async function initSqlJsLib() {
            log('Initializing sql.js...');
            try {
                const SQL = await initSqlJs({
                    locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${file}`
                });
                // Store in global for go-sqlite3-js
                // Wrap Database constructor to handle :memory: correctly
                // go-sqlite3-js passes ":memory:" as string, but sql.js expects no args for in-memory
                const OriginalDatabase = SQL.Database;
                SQL.Database = function(data) {
                    if (data === ':memory:' || data === 'file::memory:' || data === '') {
                        console.log('[sql.js shim] Creating in-memory database');
                        return new OriginalDatabase();
                    }
                    return new OriginalDatabase(data);
                };
                // Preserve prototype chain
                SQL.Database.prototype = OriginalDatabase.prototype;

                window._go_sqlite = SQL;
                window._go_sqlite_dbs = new Map();
                log('sql.js initialized successfully (with :memory: shim)');
                return true;
            } catch (err) {
                log('Failed to initialize sql.js: ' + err, true);
                return false;
            }
        }

        // Load and run Go WASM
        async function loadGoWasm() {
            log('Loading Go WASM...');
            try {
                const go = new Go();
                const result = await WebAssembly.instantiateStreaming(
                    fetch('quantlete.wasm'),
                    go.importObject
                );
                go.run(result.instance);
                log('Go WASM loaded successfully');
                return true;
            } catch (err) {
                log('Failed to load Go WASM: ' + err, true);
                return false;
            }
        }

        // Initialize everything
        async function init() {
            clearOutput();
            const sqlOk = await initSqlJsLib();
            if (!sqlOk) return;

            const wasmOk = await loadGoWasm();
            if (!wasmOk) return;

            log('\nReady! Click buttons above to test.');
        }

        // Test functions
        function simpleTest() {
            log('\n--- Simple Test ---');
            const result = parseGoResult(goTest());
            console.log('goTest result:', result);
            log(result);
        }

        function initDatabase() {
            log('\n--- Init Database ---');
            const result = parseGoResult(goInitDB());
            log(result);
        }

        function createTable() {
            log('\n--- Create Table ---');
            const result = parseGoResult(goExecSQL(`
                CREATE TABLE IF NOT EXISTS activities (
                    id INTEGER PRIMARY KEY,
                    athlete_id INTEGER,
                    name TEXT,
                    sport_type TEXT,
                    distance REAL,
                    moving_time INTEGER,
                    total_elevation_gain REAL,
                    start_date TEXT
                )
            `));
            log(result);
        }

        function insertData() {
            log('\n--- Insert Test Data ---');
            const activities = [
                [1, 123, 'Morning Run', 'Run', 5000, 1800, 50, '2024-01-15T08:00:00Z'],
                [2, 123, 'Evening Ride', 'Ride', 25000, 3600, 200, '2024-01-14T18:00:00Z'],
                [3, 123, 'Trail Run', 'Run', 8000, 2700, 150, '2024-01-13T09:00:00Z'],
                [4, 123, 'Road Bike', 'Ride', 40000, 5400, 350, '2024-01-12T10:00:00Z'],
            ];

            for (const a of activities) {
                const result = parseGoResult(goExecSQL(
                    'INSERT OR REPLACE INTO activities VALUES (?, ?, ?, ?, ?, ?, ?, ?)',
                    ...a
                ));
                log(`Insert activity ${a[0]}: ${result.ok ? 'OK' : result.error}`);
            }
        }

        function queryData() {
            log('\n--- Query Activities ---');
            const result = parseGoResult(goGetActivities(123, 10, 0));
            console.log('goGetActivities result:', result);
            log(result);
        }

        function testStats() {
            log('\n--- Dashboard Stats ---');
            const result = parseGoResult(goGetDashboardStats(123));
            console.log('goGetDashboardStats result:', result);
            log(result);
        }

        function testRawQuery() {
            log('\n--- Raw Query Test ---');
            const result = parseGoResult(goQuerySQL('SELECT * FROM activities'));
            console.log('goQuerySQL result:', result);
            log(result);
        }

        // OPFS Persistence functions
        const OPFS_DB_NAME = 'quantlete.db';

        async function getOPFSRoot() {
            if (!navigator.storage || !navigator.storage.getDirectory) {
                throw new Error('OPFS not supported in this browser');
            }
            return await navigator.storage.getDirectory();
        }

        async function saveToOPFS() {
            log('\n--- Save to OPFS ---');
            try {
                // Get the current database from go-sqlite3-js
                const dbMap = window._go_sqlite_dbs;
                const db = dbMap.get(':memory:');
                if (!db) {
                    log('No database to save. Initialize first.', true);
                    return;
                }

                // Export database to Uint8Array
                const data = db.export();
                log(`Exporting database: ${data.length} bytes`);

                // Save to OPFS
                const root = await getOPFSRoot();
                const fileHandle = await root.getFileHandle(OPFS_DB_NAME, { create: true });
                const writable = await fileHandle.createWritable();
                await writable.write(data);
                await writable.close();

                log(`✅ Saved to OPFS: ${OPFS_DB_NAME} (${data.length} bytes)`);
            } catch (err) {
                log(`Failed to save: ${err.message}`, true);
            }
        }

        async function loadFromOPFS() {
            log('\n--- Load from OPFS ---');
            try {
                const root = await getOPFSRoot();

                // Try to get the file
                let fileHandle;
                try {
                    fileHandle = await root.getFileHandle(OPFS_DB_NAME);
                } catch (e) {
                    log('No saved database found in OPFS. Use "Init Database" to create one.', true);
                    return;
                }

                // Read the file
                const file = await fileHandle.getFile();
                const arrayBuffer = await file.arrayBuffer();
                const data = new Uint8Array(arrayBuffer);
                log(`Loading database: ${data.length} bytes`);

                // Create new sql.js database from the data
                const SQL = window._go_sqlite;
                const OriginalDatabase = SQL.Database.prototype.constructor;
                const db = new OriginalDatabase(data);

                // Replace the database in the map
                window._go_sqlite_dbs.set(':memory:', db);

                log(`✅ Loaded from OPFS: ${OPFS_DB_NAME} (${data.length} bytes)`);
                log('Database restored! Try "Query Data" or "Test Stats".');
            } catch (err) {
                log(`Failed to load: ${err.message}`, true);
            }
        }

        async function clearOPFS() {
            log('\n--- Clear OPFS ---');
            try {
                const root = await getOPFSRoot();
                await root.removeEntry(OPFS_DB_NAME);
                log(`✅ Deleted ${OPFS_DB_NAME} from OPFS`);
            } catch (err) {
                if (err.name === 'NotFoundError') {
                    log('No database file to delete.');
                } else {
                    log(`Failed to clear: ${err.message}`, true);
                }
            }
        }

        async function checkOPFS() {
            log('\n--- Check OPFS ---');
            try {
                const root = await getOPFSRoot();

                // List all files
                const files = [];
                for await (const [name, handle] of root) {
                    if (handle.kind === 'file') {
                        const file = await handle.getFile();
                        files.push({ name, size: file.size, modified: file.lastModified });
                    }
                }

                if (files.length === 0) {
                    log('OPFS is empty. No saved databases.');
                } else {
                    log(`OPFS contents:`);
                    for (const f of files) {
                        const date = new Date(f.modified).toLocaleString();
                        log(`  📄 ${f.name}: ${f.size} bytes (${date})`);
                    }
                }
            } catch (err) {
                log(`Failed to check OPFS: ${err.message}`, true);
            }
        }

        // Start
        init();
    </script>
</body>
</html>
