# Quantlete Strava Proxy Worker
#
# This worker acts as a stateless CORS proxy for Strava API calls.
# Credentials (client_id, client_secret) are sent by the browser with each request.
#
name = "quantlete-strava-proxy"
main = "src/index.ts"
compatibility_date = "2024-12-01"
account_id = "9790c6f97c4032b6a3933442ba9817ec"
workers_dev = true

# Optional environment variables (for backwards compatibility only)
# STRAVA_CLIENT_ID - Falls back if not provided in request body
# STRAVA_CLIENT_SECRET - Falls back if not provided in request body
# ALLOWED_ORIGIN - The frontend URL for CORS (default: * in dev)

[vars]
STRAVA_API_BASE = "https://www.strava.com/api/v3"
STRAVA_AUTH_URL = "https://www.strava.com/oauth/authorize"
STRAVA_TOKEN_URL = "https://www.strava.com/oauth/token"
ALLOWED_ORIGIN = "https://app.quantlete.fit"

# Custom domain routing
[[routes]]
pattern = "proxy.quantlete.fit/*"
zone_name = "quantlete.fit"
