name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Generate Go code
        run: |
          go run ./scripts/generate-sql
          go run ./scripts/generate-adapters
          go run ./scripts/generate-wasm-registration

      # embed.go requires web/dist to exist for any build of the root package;
      # this job never builds the real web bundle, so stub it
      - name: Stub web assets for go:embed
        run: |
          mkdir -p web/dist
          echo '<!doctype html><!-- placeholder for go:embed; real assets are built in the web job -->' > web/dist/index.html

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          # pinned to match the local toolchain (v6/latest resolves to a
          # Go 1.24-built v1.x that rejects go.mod's 1.25.4)
          version: v2.12.2

      - name: Check adapter parity
        run: go run ./scripts/check-adapter-parity

  go-wasm:
    name: Go WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Generate Go code
        run: |
          go run ./scripts/generate-sql
          go run ./scripts/generate-adapters
          go run ./scripts/generate-wasm-registration

      - name: Build WASM
        run: |
          mkdir -p web/public/wasm
          GOOS=js GOARCH=wasm go build -o web/public/wasm/quantlete.wasm ./cmd/wasm/

      - name: Verify WASM size
        run: ls -lh web/public/wasm/quantlete.wasm

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Unit tests
        run: yarn test:unit

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Check formatting
        run: yarn prettier

      - name: Build
        run: yarn build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          retention-days: 7

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Generate Go code
        run: |
          go run ./scripts/generate-sql
          go run ./scripts/generate-adapters
          go run ./scripts/generate-wasm-registration

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Download web build artifacts
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist/

      - name: Install Playwright dependencies
        working-directory: web
        run: yarn install --immutable

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        # 266 tests on a single worker (parallel workers share one server/DB
        # and need the de-flake pass first); 15 min killed the suite mid-run
        timeout-minutes: 30
        run: ./scripts/e2e-setup.sh bash -c 'cd web && npx playwright test'
        env:
          CI: true

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
