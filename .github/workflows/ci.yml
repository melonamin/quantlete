name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Build
        run: CGO_ENABLED=1 go build -v ./...

      - name: Test
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Check adapter parity
        run: go run ./scripts/check-adapter-parity

  go-wasm:
    name: Go WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build WASM
        run: |
          mkdir -p web/public/wasm
          GOOS=js GOARCH=wasm go build -o web/public/wasm/quantlete.wasm ./cmd/wasm/

      - name: Verify WASM size
        run: ls -lh web/public/wasm/quantlete.wasm

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Check formatting
        run: yarn prettier

      - name: Build
        run: yarn build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          retention-days: 7

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Download web build artifacts
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist/

      - name: Build Go binary
        run: go build -o bin/quantlete ./cmd/quantlete

      - name: Generate demo database
        run: |
          mkdir -p /tmp/e2e-data
          QUANTLETE_STORAGE_DATA_DIR=/tmp/e2e-data QUANTLETE_STORAGE_DB_FILE=test.db \
            ./bin/quantlete demo --activities=50 --months=6 --athlete="E2E Test User"

      - name: Start Go server
        run: |
          QUANTLETE_STORAGE_DATA_DIR=/tmp/e2e-data QUANTLETE_STORAGE_DB_FILE=test.db \
          QUANTLETE_SERVER_PORT=8081 QUANTLETE_SERVER_DEV_MODE=true \
            ./bin/quantlete serve &
          echo "Waiting for server to be ready..."
          for i in {1..30}; do
            if curl -s http://localhost:8081/api/v1/auth/status > /dev/null 2>&1; then
              echo "Server ready"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Server failed to start"
              exit 1
            fi
            sleep 1
          done

      - name: Install Playwright dependencies
        working-directory: web
        run: yarn install --immutable

      - name: Run E2E tests
        working-directory: web
        run: npx playwright test
        env:
          CI: true

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
