# Quantlete Build & Release Pipeline
# Builds cross-platform Go binaries with embedded web assets and Docker image

name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

env:
  GO_VERSION: "1.24.5"
  NODE_VERSION: "22"
  DOCKER_IMAGE: "melonamin/quantlete"

jobs:
  # ==========================================================================
  # Build Web Assets
  # ==========================================================================
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: web/yarn.lock

      - name: Generate TypeScript from SQL
        run: |
          go run ./scripts/generate-sql
          go run ./scripts/generate-schema

      - name: Install dependencies
        working-directory: web
        run: yarn install --frozen-lockfile

      - name: Build web assets
        working-directory: web
        run: yarn build:server

      - name: Upload web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          retention-days: 1

  # ==========================================================================
  # Build Cross-Platform Binaries
  # ==========================================================================
  build-binaries:
    name: Build Binaries
    runs-on: ubuntu-latest
    needs: build-web
    steps:
      - uses: actions/checkout@v4

      - name: Download web artifacts
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist/

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Generate Go code
        run: go run ./scripts/generate-sql

      - name: Determine version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          fi

      - name: Build binaries
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.buildDate=${BUILD_DATE}"

          mkdir -p dist

          # Linux
          GOOS=linux GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/quantlete-linux-amd64 ./cmd/quantlete
          GOOS=linux GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/quantlete-linux-arm64 ./cmd/quantlete

          # macOS
          GOOS=darwin GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/quantlete-darwin-amd64 ./cmd/quantlete
          GOOS=darwin GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/quantlete-darwin-arm64 ./cmd/quantlete

          # Windows
          GOOS=windows GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/quantlete-windows-amd64.exe ./cmd/quantlete
          GOOS=windows GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/quantlete-windows-arm64.exe ./cmd/quantlete

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/
          retention-days: 7

  # ==========================================================================
  # Build & Push Docker Image
  # ==========================================================================
  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: build-binaries
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
    steps:
      - uses: actions/checkout@v4

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Determine tags
        id: tags
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            echo "tags=${{ env.DOCKER_IMAGE }}:${VERSION},${{ env.DOCKER_IMAGE }}:latest" >> $GITHUB_OUTPUT
          else
            echo "tags=${{ env.DOCKER_IMAGE }}:${GITHUB_SHA::8},${{ env.DOCKER_IMAGE }}:edge" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================================================
  # Create GitHub Release
  # ==========================================================================
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build-binaries, docker]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist/

      - name: Create archives
        run: |
          cd dist
          for binary in quantlete-*; do
            if [[ "${binary}" == *.exe ]]; then
              name="${binary%.exe}"
              zip "${name}.zip" "${binary}"
            else
              chmod +x "${binary}"
              tar -czvf "${binary}.tar.gz" "${binary}"
            fi
          done
          sha256sum *.tar.gz *.zip > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          generate_release_notes: true
