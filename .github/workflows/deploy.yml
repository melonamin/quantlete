# Deployment Pipeline
# Deploys docs and main WASM app to Cloudflare Pages

name: Deploy

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "web/**"
      - "cmd/wasm/**"
      - "internal/**"
      - "schema/**"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:
    inputs:
      deploy_docs:
        description: "Deploy docs"
        type: boolean
        default: true
      deploy_app:
        description: "Deploy WASM app"
        type: boolean
        default: true

env:
  GO_VERSION: "1.24.5"
  NODE_VERSION: "22"

jobs:
  # ==========================================================================
  # Detect what changed
  # ==========================================================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docs:
              - 'docs/**'
            app:
              - 'web/**'
              - 'cmd/wasm/**'
              - 'internal/**'
              - 'schema/**'

  # ==========================================================================
  # Deploy Docs
  # ==========================================================================
  deploy-docs:
    name: Deploy Docs
    runs-on: ubuntu-latest
    needs: changes
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.deploy_docs) ||
      (github.event_name == 'push' && needs.changes.outputs.docs == 'true')
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: quantlete-docs
          directory: docs
          branch: master

  # ==========================================================================
  # Deploy Main WASM App
  # ==========================================================================
  deploy-worker:
    name: Deploy Worker
    runs-on: ubuntu-latest
    needs: changes
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.deploy_app) ||
      (github.event_name == 'push' && needs.changes.outputs.app == 'true')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: worker
        run: npm ci

      - name: Deploy Cloudflare Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

  # ==========================================================================
  # Deploy Main WASM App
  # ==========================================================================
  deploy-app:
    name: Deploy App
    runs-on: ubuntu-latest
    needs:
      - changes
      - deploy-worker
    if: |
      ((github.event_name == 'workflow_dispatch' && inputs.deploy_app) ||
      (github.event_name == 'push' && needs.changes.outputs.app == 'true')) &&
      (needs.deploy-worker.result == 'success' || needs.deploy-worker.result == 'skipped')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: web/yarn.lock

      - name: Install dependencies
        working-directory: web
        run: yarn install --frozen-lockfile

      - name: Generate code
        run: |
          go run ./scripts/generate-sql
          go run ./scripts/generate-schema
          go run ./scripts/generate-ts-types
          go run ./scripts/generate-adapters
          go run ./scripts/generate-wasm-registration
          go run ./scripts/generate-go-storage

      - name: Build Go WASM
        run: |
          mkdir -p web/public/wasm
          GOOS=js GOARCH=wasm go build -o web/public/wasm/quantlete.wasm ./cmd/wasm/
          if [ -f "$(go env GOROOT)/lib/wasm/wasm_exec.js" ]; then
            cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" web/public/wasm/
          else
            cp "$(go env GOROOT)/misc/wasm/wasm_exec.js" web/public/wasm/
          fi
          cp web/node_modules/sql.js/dist/sql-wasm.wasm web/public/wasm/
          ls -lh web/public/wasm/

      - name: Build WASM app
        working-directory: web
        env:
          VITE_BUILD_MODE: wasm
          VITE_CF_WORKER_URL: ${{ secrets.VITE_CF_WORKER_URL }}
        run: yarn build:wasm

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: quantlete
          directory: web/dist-wasm
          branch: master
